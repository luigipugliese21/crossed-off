<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>crossed off.</title>
<meta name="theme-color" content="#24493f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23fbf5e6' stroke='%231d2433' stroke-width='2.5'/%3E%3Cpath d='M8 16l6 6L27 5' fill='none' stroke='%23e2412f' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Kalam:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   crossed off. — a stationery-desk to-do book
   Style: tactile / skeuomorphic stationery + risograph print
   accents (misregistered ink, highlighter marks, rubber stamps)
   on a self-healing cutting mat.
   ───────────────────────────────────────────────────────────── */
:root{
  --mat:#24493f; --mat-line:rgba(255,255,255,.055); --mat-line-strong:rgba(255,255,255,.12);
  --paper:#fbf5e6; --paper-2:#f3ead3; --rule:#bcd0de; --margin:#ec9a8e;
  --ink:#1d2433; --ink-soft:#626877; --red:#e2412f; --blue:#2c5bd8;
  --yellow:#ffd93b; --pink:#ff8fb8; --mint:#7fd6b4; --sky:#8fb4ff; --orange:#ffa65c; --tomato:#ff7b5f;
  --lh:38px; --vc:var(--yellow);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .18  0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --pencil:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M3 25l2.2-6.6L19 4.6l4.4 4.4L9.6 22.8z' fill='%23ffd93b' stroke='%231d2433' stroke-width='1.6' stroke-linejoin='round'/><path d='M19 4.6l2-2 4.4 4.4-2 2z' fill='%23ff8fb8' stroke='%231d2433' stroke-width='1.6' stroke-linejoin='round'/><path d='M3 25l2.2-6.6 4.4 4.4z' fill='%23e2412f'/></svg>") 3 25;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Kalam','Segoe Print','Comic Sans MS',cursive; color:var(--ink);
  background-color:var(--mat);
  background-image:
    linear-gradient(var(--mat-line-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--mat-line-strong) 1px,transparent 1px),
    linear-gradient(var(--mat-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--mat-line) 1px,transparent 1px),
    linear-gradient(45deg,transparent 49.85%,rgba(255,255,255,.05) 50%,transparent 50.15%);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px,960px 960px;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.ruler{position:fixed;top:0;left:0;right:0;height:22px;pointer-events:none;
  font:10px 'Space Mono',monospace;color:rgba(255,255,255,.28);display:flex;overflow:hidden}
.ruler span{flex:0 0 120px;padding:3px 0 0 4px;border-left:1px solid rgba(255,255,255,.2)}

/* ── notebook ─────────────────────────────────────── */
.notebook{
  position:relative; max-width:900px; margin:58px auto 90px; padding-left:46px;
  background:var(--noise),linear-gradient(180deg,#fdf8ec,var(--paper) 30%,#f8f0dc);
  border-radius:5px 14px 14px 5px;
  box-shadow:
    0 30px 60px -22px rgba(0,0,0,.6), 0 10px 20px rgba(0,0,0,.22),
    5px 5px 0 -1px var(--paper-2), 5px 5px 0 0 rgba(0,0,0,.1),
    10px 10px 0 -1px #ece1c5, 10px 10px 0 0 rgba(0,0,0,.12);
}
.holes{position:absolute;left:0;top:0;bottom:0;width:46px;border-right:1px dashed rgba(0,0,0,.09);
  background:radial-gradient(circle at 23px 31px,#173029 0 7.5px,rgba(0,0,0,.18) 8px,transparent 10.5px) 0 0/46px 62px repeat-y}
.tape{position:absolute;top:-17px;width:132px;height:34px;z-index:3;opacity:.85;
  clip-path:polygon(2% 0,98% 4%,100% 22%,97% 42%,100% 62%,97% 82%,99% 100%,1% 96%,3% 77%,0 57%,3% 37%,0 17%)}
.tape.a{left:16%;transform:rotate(-3.5deg);background:repeating-linear-gradient(45deg,rgba(255,217,59,.75) 0 9px,rgba(255,236,150,.75) 9px 18px)}
.tape.b{right:10%;transform:rotate(4deg);background:repeating-linear-gradient(-45deg,rgba(255,143,184,.7) 0 6px,rgba(255,196,218,.7) 6px 12px)}

/* index tabs sticking out of the right edge */
.tabs{position:absolute;right:-40px;top:96px;display:flex;flex-direction:column;gap:7px;z-index:-1}
.tab{writing-mode:vertical-rl;font:700 12px 'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
  padding:18px 9px 18px 11px;border:0;border-radius:0 11px 11px 0;background:var(--c);cursor:pointer;
  box-shadow:3px 3px 0 rgba(0,0,0,.28);transform:translateX(-9px);transition:transform .22s cubic-bezier(.3,1.6,.5,1);position:relative}
.tab:hover{transform:translateX(-3px)}
.tab.on{transform:translateX(2px);box-shadow:5px 4px 0 rgba(0,0,0,.32)}
.tab .n{display:inline-block;writing-mode:horizontal-tb;margin-top:8px;background:var(--ink);color:var(--paper);
  border-radius:99px;font-size:10px;min-width:18px;padding:1px 4px;text-align:center;letter-spacing:0}
.tab .n:empty{display:none}

/* ── masthead ─────────────────────────────────────── */
.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 34px 14px 26px;
  border-bottom:2px solid var(--ink);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid var(--ink)}
.brand{font:900 30px/1 'Fraunces',serif;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;font-style:italic;letter-spacing:-.02em}
.brand .off{position:relative;color:var(--red)}
.brand .off::after{content:"";position:absolute;left:-3px;right:-6px;top:54%;height:3.5px;background:var(--ink);border-radius:3px;transform:rotate(-4deg)}
.tallybox{display:flex;align-items:center;gap:12px;font:11px 'Space Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}
.tallybox .lbl{line-height:1.3;text-align:right}
.tallybox .lbl b{color:var(--ink);font-size:13px}
.tally{overflow:visible}
.tally line{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.tally line.diag{stroke:var(--red)}
.tally line.fresh{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s .05s ease-out forwards}
.tally text{font:16px 'Kalam';fill:var(--ink-soft)}
@keyframes draw{to{stroke-dashoffset:0}}
.sound{font:700 10.5px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.1em;background:none;cursor:pointer;
  border:1.8px solid var(--ink);padding:5px 10px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px}
.sound.off{opacity:.45;text-decoration:line-through}

/* ── page ─────────────────────────────────────────── */
#page{position:relative;padding:8px 34px 44px 0;min-height:540px;transform-origin:left center}
#page::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.75;pointer-events:none}
#page.flip{animation:flip .48s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(1500px) rotateY(-16deg) translateX(-8px);opacity:0}to{transform:none;opacity:1}}

.phead{padding:26px 0 2px 64px;position:relative}
.phead h1{margin:0;font:800 60px/1 'Fraunces',serif;font-variation-settings:"SOFT" 60,"WONK" 1,"opsz" 144;letter-spacing:-.035em;
  color:var(--ink);text-shadow:4px 3px 0 var(--vc)}
.phead .uline{display:block;width:210px;height:14px;margin:2px 0 6px -4px;overflow:visible}
.phead .uline path{fill:none;stroke:var(--vc);stroke-width:5;stroke-linecap:round;filter:url(#rough)}
.phead .sub{margin:4px 0 0;font:12px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft)}

.banner{margin:14px 0 0 64px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:19px}
.hl{--hl:var(--yellow);padding:0 .35em;margin:0 -.1em;border-radius:.8em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(100deg,transparent .8%,var(--hl) 2.5%,color-mix(in srgb,var(--hl) 72%,transparent) 30%,color-mix(in srgb,var(--hl) 85%,transparent) 75%,var(--hl) 96%,transparent 98.5%)}
.soon{font:11px 'Space Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em}

.sec{margin-top:22px}
.sec-h{margin:0 0 0 64px;display:flex;gap:10px;align-items:center;font:700 11.5px/var(--lh) 'Space Mono',monospace;
  text-transform:uppercase;letter-spacing:.17em;color:var(--ink-soft)}
.sec-h b{background:var(--ink);color:var(--paper);border-radius:99px;padding:0 7px;font-size:10.5px;line-height:18px;letter-spacing:0}
.sec-h .link{margin-left:auto}
ul.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh)}

/* ── a crossable line ─────────────────────────────── */
.item{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto 30px;align-items:start;min-height:var(--lh)}
.box{width:46px;height:var(--lh);display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.box svg{width:21px;height:21px;overflow:visible;transition:transform .15s}
.box:active svg{transform:scale(.8) rotate(-6deg)}
.box .frame{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .15s}
.box:hover .frame{stroke-width:2.6}
.box .check{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;transition:stroke-dashoffset .28s .08s ease-out}
.is-done .box .check{stroke-dashoffset:0}
.wrap{position:relative;padding:0 8px 0 16px;touch-action:pan-y;cursor:var(--pencil),crosshair}
.is-done .wrap{cursor:default}
.txt{font-size:21px;line-height:var(--lh);user-select:none;-webkit-user-select:none;transition:color .5s,opacity .5s;overflow-wrap:anywhere}
.is-done .txt{color:var(--ink-soft);opacity:.72}
.txt[contenteditable="true"]{user-select:text;-webkit-user-select:text;outline:none;cursor:text;background:color-mix(in srgb,var(--yellow) 40%,transparent);border-radius:3px;opacity:1;color:var(--ink)}
.strike{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.strike path{fill:none;stroke:var(--red);stroke-width:2.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset .42s cubic-bezier(.65,.05,.36,1)}
.dragging .strike path{transition:none}
.dragging .txt{color:var(--ink)}
.meta{display:flex;gap:9px;align-items:center;height:var(--lh);padding-left:8px;white-space:nowrap;font:12px 'Space Mono',monospace;color:var(--ink-soft)}
.del{width:30px;height:var(--lh);display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;opacity:.32;transition:opacity .2s,transform .2s}
.del svg{width:14px;height:14px;stroke:var(--ink-soft);stroke-width:2.2;stroke-linecap:round;fill:none}
.item:hover .del{opacity:.7}
.del:hover{opacity:1!important;transform:rotate(90deg) scale(1.15)}
.del:hover svg{stroke:var(--red)}
.toast{position:fixed;left:50%;bottom:28px;z-index:70;display:flex;align-items:center;gap:16px;padding:10px 14px 10px 18px;
  background:var(--yellow);background-image:var(--noise);color:var(--ink);font-size:18px;max-width:min(560px,calc(100vw - 24px));
  box-shadow:3px 4px 0 var(--ink);border:2px solid var(--ink);border-radius:4px 10px 6px 12px;transform:translateX(-50%) rotate(-1.2deg);
  animation:toastIn .35s cubic-bezier(.2,1.5,.4,1)}
.toast .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast .chip{background:var(--paper);flex:0 0 auto}
.toast.out{animation:toastOut .25s ease-in forwards}
@keyframes toastIn{from{transform:translate(-50%,40px) rotate(4deg);opacity:0}}
@keyframes toastOut{to{transform:translate(-50%,40px) rotate(-4deg);opacity:0}}
@media (max-width:760px){.toast{bottom:86px}}
.star{background:none;border:0;padding:0 2px;cursor:pointer;font:20px 'Kalam';color:var(--rule);line-height:1;transition:transform .2s,color .2s}
.star:hover{transform:rotate(30deg) scale(1.15)}
.star.on{color:var(--red)}
.freq{border:1.4px solid var(--ink-soft);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:0 7px;font-size:10.5px;line-height:18px;text-transform:uppercase}
.streak{color:var(--red)}
.tag{font:700 10.5px/18px 'Space Mono',monospace;padding:0 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em;transform:rotate(-2deg);color:var(--ink)}
.lv-late{background:var(--red);color:#fff}.lv-today{background:var(--orange)}.lv-soon{background:var(--yellow)}
.lv-later{outline:1.5px solid var(--ink-soft);outline-offset:-1.5px;transform:none;color:var(--ink-soft)}
.lv-met{color:var(--blue);outline:2px solid var(--blue);outline-offset:-2px;filter:url(#rough);transform:rotate(-4deg)}
.lv-latemet{color:var(--red);outline:2px solid var(--red);outline-offset:-2px;filter:url(#rough);transform:rotate(3deg)}
.note{padding-left:64px;font-size:20px;line-height:var(--lh);color:var(--ink-soft)}

/* ── a list tucked inside a line (groceries, steps…) ── */
.lst{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:3px 4px;cursor:pointer;
  font:700 11px 'Space Mono',monospace;color:var(--ink-soft);opacity:.4;transition:opacity .2s,transform .2s,color .2s}
.lst svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.lst.has,.lst.on,.item:hover .lst{opacity:1}
.lst.on{color:var(--red)}
.lst:hover{transform:rotate(-4deg) scale(1.1)}
.subs{grid-column:2/-1;list-style:none;margin:0;padding:0 0 0 16px}
.sub{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:start;min-height:var(--lh);cursor:pointer;outline:none}
.sub:focus-visible .sub-txt{background:color-mix(in srgb,var(--yellow) 40%,transparent)}
.sub-box{height:var(--lh);display:grid;place-items:center}
.sub-box svg{width:16px;height:16px;overflow:visible;transition:transform .15s}
.sub:active .sub-box svg{transform:scale(.8) rotate(-6deg)}
.sub-box .frame{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub-box .check{fill:none;stroke:var(--red);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;transition:stroke-dashoffset .26s ease-out}
.sub.on .sub-box .check{stroke-dashoffset:0}
.sub-txt{font-size:19px;line-height:var(--lh);padding-left:4px;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none}
.sub-txt span{padding:0 4px;margin:0 -4px;background:linear-gradient(var(--red),var(--red)) no-repeat 0 58%/0 2.4px;
  transition:background-size .34s cubic-bezier(.65,.05,.36,1),color .4s,opacity .4s}
.sub.on .sub-txt span{background-size:100% 2.4px;color:var(--ink-soft);opacity:.75}
.sub-new{display:flex;align-items:center;gap:8px;min-height:var(--lh);padding:0 6px 4px 34px}
.sub-in{font-size:18px;flex:1 1 120px;border-bottom-width:1.5px}
.sub-plus{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;cursor:pointer;background:var(--vc);font:700 17px/1 'Space Mono';
  border:1.8px solid var(--ink);border-radius:58% 42% 55% 45%/48% 58% 42% 52%;box-shadow:1.5px 2px 0 var(--ink)}
.sub-plus:active{transform:translate(1.5px,2px);box-shadow:none}

/* moments */
.item.fresh .wrap{animation:writein .65s cubic-bezier(.4,0,.2,1) both}
@keyframes writein{from{clip-path:inset(-4px 100% -4px 0)}to{clip-path:inset(-4px -20px -4px 0)}}
.item.thud{animation:thud .32s ease-out}
@keyframes thud{30%{transform:translateY(2px) scale(.996)}}
.item.crumple{animation:crumple .4s cubic-bezier(.6,-.2,.7,.3) forwards;transform-origin:30% 50%}
@keyframes crumple{to{transform:scale(.25) rotate(-18deg) translateY(14px);opacity:0;filter:blur(1px)}}
.stamp{position:absolute;right:48px;top:calc(var(--lh) / 2);z-index:4;pointer-events:none;font:700 15px 'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  color:var(--sc);border:3px solid currentColor;border-radius:6px;padding:1px 10px;background:color-mix(in srgb,var(--paper) 55%,transparent);
  filter:url(#rough);mix-blend-mode:multiply;animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{transform:translateY(-50%) rotate(var(--r)) scale(2.8);opacity:0}55%{opacity:.95;transform:translateY(-50%) rotate(var(--r)) scale(.9)}100%{transform:translateY(-50%) rotate(var(--r)) scale(1);opacity:.88}}
.scrap{position:fixed;left:0;top:0;width:var(--w);height:var(--h);background:var(--c);z-index:50;pointer-events:none;
  animation:scrap .95s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes scrap{from{transform:translate(var(--x),var(--y)) rotate(0)}to{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) rotate(var(--rot));opacity:0}}
.slate{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.slate span{font:800 clamp(40px,9vw,84px)/1 'Fraunces',serif;font-variation-settings:"WONK" 1;color:var(--red);border:7px solid currentColor;border-radius:14px;
  padding:10px 30px;background:color-mix(in srgb,var(--paper) 70%,transparent);filter:url(#rough);mix-blend-mode:multiply;
  animation:slate 2.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slate{0%{transform:rotate(-9deg) scale(3);opacity:0}14%{transform:rotate(-9deg) scale(.92);opacity:.95}20%{transform:rotate(-9deg) scale(1)}80%{opacity:.95}100%{opacity:0;transform:rotate(-9deg) scale(1)}}
.crossed.tearing{animation:tear .7s cubic-bezier(.5,0,.75,0) forwards;transform-origin:20% 0;
  clip-path:polygon(0 3%,4% 0,9% 3%,14% 0,19% 4%,25% 1%,31% 4%,37% 0,44% 3%,50% 0,57% 4%,63% 1%,70% 4%,76% 0,83% 3%,89% 0,95% 4%,100% 1%,100% 100%,0 100%)}
@keyframes tear{20%{transform:rotate(-1.5deg) translateY(3px)}100%{transform:rotate(-9deg) translateY(160px);opacity:0}}

/* ── add row ─────────────────────────────────────── */
.add{display:flex;align-items:center;gap:10px;margin:18px 0 0;padding:0 0 0 64px;min-height:var(--lh);flex-wrap:wrap}
.write{flex:1 1 220px;min-width:0;font:21px 'Kalam',cursive;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--ink-soft);
  padding:2px 2px 3px;caret-color:var(--red);outline:none;transition:border-color .2s}
.write::placeholder{color:#a3a39b;font-style:italic}
.write:focus{border-bottom:2px solid var(--red)}
.write.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.add-btn{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;cursor:pointer;background:var(--vc);font:700 24px/1 'Space Mono';
  border:2px solid var(--ink);border-radius:58% 42% 55% 45%/48% 58% 42% 52%;box-shadow:2px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.add-btn:hover{transform:rotate(-8deg)}
.add-btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0 0 64px;font:12px 'Space Mono',monospace;color:var(--ink-soft)}
.chip{font:700 11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;background:transparent;
  border:1.8px solid var(--ink);padding:5px 11px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;transition:transform .15s}
.chip:hover{transform:rotate(-2deg)}
.chip.on{background:var(--ink);color:var(--paper)}
.num,.due-in{font:13px 'Space Mono',monospace;color:var(--ink);background:rgba(255,255,255,.55);border:1.8px solid var(--ink);
  padding:4px 7px;border-radius:15px 225px 15px 255px/255px 15px 225px 15px;outline:none}
.num{width:58px}
.due-in:focus,.num:focus{border-color:var(--red)}
.link{background:none;border:0;cursor:pointer;font:700 11px 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-soft);text-decoration:underline wavy var(--red) 1.5px;text-underline-offset:4px;padding:0}
.link:hover{color:var(--red)}

<script>

  { id: 'today', label: 'Today', c: 'var(--yellow)' },

  { id: 'chores', label: 'Chores', c: 'var(--mint)' },
  { id: 'deadlines', label: 'Deadlines', c: 'var(--pink)' },

/* ═════════════ state ═════════════ */
const LS = 'crossedoff.v1';

    td('…or tap the little box in the margin'),

    ch('Take out trash & recycling', 'weekly'),

/* ═════════════ domain logic ═════════════ */
function periodKey(freq, d) {

    if (ui.openWeek === k) {
      rows += `<div class="wk-edit" data-week="${k}"><input class="write wk-in" value="${esc(m ? m.label : '')}" placeholder="What's this week about?" maxlength="80">
        <div class="sw">${Object.keys(COL).map(c => `<button class="swatch${m && m.color === c ? ' on' : ''}" data-act="swatch" data-color="${c}" style="--hl:${COL[c]}" aria-label="${c} highlighter"></button>`).join('')}</div>
        <button class="chip on" data-act="wsave">save</button>${m ? '<button class="link" data-act="wclear">unmark</button>' : ''}</div>`;
    }
    mon = addDays(mon, 7); count++;
  }
  const up = upcomingWeeks(6);
  let h = head('Weeks', `${y} · ${count} weeks · ${marked} highlighted`);
  h += `<div class="yearnav"><button class="arrow" data-act="year" data-d="-1" aria-label="Previous year">←</button><span class="yr">${y}</span><button class="arrow" data-act="year" data-d="1" aria-label="Next year">→</button>
        ${y !== isoWeek(t).year ? '<button class="link" data-act="year" data-d="0">back to now</button>' : ''}</div>`;
  if (up.length) h += `<div class="wchips">${up.map(w => `<span><span class="hl" style="--hl:${COL[w.v.color]}">${esc(w.v.label || 'important')}</span><span class="when">W${isoWeek(w.mon).week} · ${fmtShort(w.mon)}</span></span>`).join('')}</div>`;
  h += `<p class="hint">Tap a week to highlight it: trips, exams, crunch weeks, birthdays. Red dots are deadlines.</p>`;
  return h + `<div class="weeks">${rows}</div>`;
};

/* ═════════════ render ═════════════ */
const page = $('#page'), mast = $('#mast'), tabs = $('#tabs'), book = $('#book');
let lastTally = null, renderTimer = null, editing = false, drag = null;

function renderMast() {
  const n = state.tally[T()] || 0, mon = mondayOf(today());
  let week = 0; for (let i = 0; i < 7; i++) week += state.tally[ymd(addDays(mon, i))] || 0;
  const fresh = lastTally !== null && n > lastTally; lastTally = n;
  mast.innerHTML = `<div class="brand">crossed <span class="off">off</span>.</div>
    <div class="tallybox"><div class="lbl">crossed off today<br><b>${n}</b> today · <b>${week}</b> this week</div>${tallySVG(n, fresh)}</div>
    <button class="sound${Sound.muted ? ' off' : ''}" data-act="sound" aria-pressed="${!Sound.muted}">♪ sound</button>`;
}
function renderTabs() {
  const L = todayLists(), t = today();
  const counts = {
    today: openCount(L.deadlines) + openCount(L.chores) + openCount(L.todos),
    todo: state.todos.filter(x => !x.done).length,
    chores: state.chores.filter(c => !choreInfo(c).satisfied).length,
    deadlines: state.deadlines.filter(d => !d.done && diffDays(t, parse(d.due)) <= 7).length,
    weeks: '',
  };
  tabs.innerHTML = VIEWS.map((v, i) => `<button class="tab${ui.view === v.id ? ' on' : ''}" data-view="${v.id}" style="--c:${v.c}" title="${v.label} (${i + 1})">${v.label}<span class="n">${counts[v.id] || ''}</span></button>`).join('');
}
function render() {
  clearTimeout(renderTimer);
  book.style.setProperty('--vc', VIEWS.find(v => v.id === ui.view).c);
  renderMast(); renderTabs();
  page.innerHTML = V[ui.view]();
  layoutStrikes();
  ui.justAdded = null;
  if (ui.view === 'weeks' && ui.scrollWeek) {
    ui.scrollWeek = false;
    const now = $('.wk.is-now', page);
    if (now) now.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  if (ui.openWeek) { const inp = $('.wk-in', page); if (inp) inp.focus({ preventScroll: true }); }
}
function scheduleRender(ms = 1400) {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    if (drag || editing || (a && a.matches('.sub-in') && a.value)) return scheduleRender(500);
    render();
  }, ms);
}
function go(view) {
  if (!V[view]) return;
  if (view !== ui.view) Sound.swish();
  ui.view = view; ui.openWeek = null; localStorage.setItem('crossedoff.view', view);
  history.replaceState(null, '', '#' + view);
  if (view === 'weeks') { ui.scrollWeek = true; ui.weeksYear = isoWeek(today()).year; }
  render();
  page.classList.remove('flip'); void page.offsetWidth; page.classList.add('flip');
  if (view !== 'weeks') window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═════════════ the main event: crossing out ═════════════ */
function cross(li, fromDrag) {
  const { kind, id } = li.dataset, path = $('.strike path', li);
  const wasLate = kind === 'deadline' && (() => { const d = findItem(kind, id); return d && d.due < T(); })();
  li.classList.add('is-done', 'busy');
  path.style.strokeDashoffset = '0';
  fromDrag ? Sound.scratch(0.12) : Sound.scratch();
  buzz(12);
  setDone(kind, id, true); save(); renderMast(); renderTabs();
  setTimeout(() => {
    const rects = $('.txt', li).getClientRects(), last = rects[rects.length - 1];
    if (last) burst(last.right + 8, last.top + last.height / 2);
    stampOn(li, kind, wasLate); li.classList.add('thud'); Sound.thunk(); buzz(20);
  }, RM || fromDrag ? 60 : 380);
  if (ui.view !== 'weeks' && !$$('.item:not(.is-done)', page).length) setTimeout(cleanSlate, 650);
  scheduleRender(1500);
}
function uncross(li) {
  const { kind, id } = li.dataset, path = $('.strike path', li);
  li.classList.remove('is-done'); li.classList.add('busy');
  path.style.strokeDashoffset = path._len;
  Sound.erase();
  setDone(kind, id, false); save(); renderMast(); renderTabs();
  scheduleRender(800);
}
function toggle(li) {
  if (li.classList.contains('busy')) return;
  li.classList.contains('is-done') ? uncross(li) : cross(li);
}

function addItem(kind) {
  const inp = $(`[data-add="${kind}"]`, page); if (!inp) return;
  let text = inp.value.trim().replace(/\s+/g, ' ');
  if (!text) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
  const id = uid(), now = Date.now();
  if (kind === 'todo') {
    const star = /(^!\s*|\s*!$)/.test(text); text = text.replace(/^!\s*|\s*!$/g, '').trim() || text;
    state.todos.push({ id, text, created: now, done: null, star });
  } else if (kind === 'chore') {
    const n = clamp(parseInt(($('.num', page) || {}).value, 10) || ui.choreN, 1, 365); ui.choreN = n;
    state.chores.push({ id, text, freq: ui.choreFreq, n: ui.choreFreq === 'interval' ? n : undefined, history: [], created: now });
  } else {
    const due = ($('.due-in', page) || {}).value || ymd(addDays(today(), 7)); ui.lastDue = due;
    state.deadlines.push({ id, text, due, done: null, created: now });
  }
  ui.justAdded = id; save(); Sound.tick(); render();
  const again = $(`[data-add="${kind}"]`, page); if (again) again.focus({ preventScroll: true });
}

/* lists inside a line */
function toggleSub(li, row) {
  const { kind, id } = li.dataset, x = findItem(kind, id); if (!x) return;
  const s = (x.subs || []).find(s => s.id === row.dataset.sub); if (!s) return;
  const on = !row.classList.contains('on');
  if (on) { s.done = Date.now(); bump(1); Sound.scratch(0.16); buzz(8); }
  else { if (isToday(s.done)) bump(-1); s.done = null; Sound.erase(); }
  row.classList.toggle('on', on); row.setAttribute('aria-checked', on);
  save(); renderMast();
  const n = $('.lst-n', li); if (n) n.textContent = subCount(kind, x);
  // last thing on the list crossed → the line itself is done
  const idle = () => li.isConnected && !li.classList.contains('is-done') && !li.classList.contains('busy');
  if (on && x.subs.every(q => subOn(kind, x, q)) && idle()) setTimeout(() => { if (idle()) cross(li); }, 420);
}
function addSub(li) {
  const inp = $('.sub-in', li), { kind, id } = li.dataset, x = findItem(kind, id); if (!inp || !x) return;
  const parts = inp.value.split(',').map(t => t.trim().replace(/\s+/g, ' ')).filter(Boolean);
  if (!parts.length) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
  x.subs = x.subs || [];
  parts.forEach(text => x.subs.push({ id: uid(), text, done: null }));
  save(); Sound.tick(); render();
  const again = $(`.item[data-id="${id}"] .sub-in`, page); if (again) again.focus({ preventScroll: true });
}

function startEdit(txt) {
  const li = txt.closest('.item'); if (!li || li.classList.contains('busy')) return;
  const orig = txt.textContent; editing = true;
  txt.contentEditable = 'true'; txt.focus();
  const r = document.createRange(); r.selectNodeContents(txt); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish = keep => {
    txt.removeEventListener('blur', onBlur); txt.removeEventListener('keydown', onKey);
    const v = txt.textContent.trim().replace(/\s+/g, ' ');
    txt.contentEditable = 'false'; editing = false;
    const item = findItem(li.dataset.kind, li.dataset.id);
    if (keep && v && v !== orig && item) { item.text = v; save(); Sound.tick(); }
    render();
  };
  const onBlur = () => finish(true);
  const onKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); txt.blur(); }
    else if (e.key === 'Escape') { txt.textContent = orig; txt.removeEventListener('blur', onBlur); finish(false); }
  };
  txt.addEventListener('blur', onBlur); txt.addEventListener('keydown', onKey);
}

function saveWeek(k, color) {
  const inp = $('.wk-in', page), label = inp ? inp.value.trim() : '';
  const prev = state.weeks[k];
  state.weeks[k] = { label, color: color || (prev && prev.color) || 'yellow' };
  ui.openWeek = null; save(); Sound.scratch(0.2); render();
}

/* ═════════════ events ═════════════ */
page.addEventListener('click', e => {
  const el = e.target.closest('[data-act], .box'); if (!el) return;
  const li = el.closest('.item');
  if (el.classList.contains('box')) return toggle(li);
  const act = el.dataset.act;
  if (act === 'del') {
    if (li.classList.contains('crumple')) return;
    li.classList.add('crumple', 'busy'); Sound.crumple(); buzz(8);
    setTimeout(() => {
      const gone = removeItem(li.dataset.kind, li.dataset.id); save(); render();
      if (gone) toast(`Tossed “${gone.item.text}”`, () => {
        state[gone.key].splice(Math.min(gone.index, state[gone.key].length), 0, gone.item);
        ui.justAdded = gone.item.id; save(); Sound.tick(); render();
      });
    }, 380);
  } else if (act === 'star') {
    const x = findItem('todo', li.dataset.id); x.star = !x.star; save(); Sound.tick(); render();
  } else if (act === 'list') {
    const id = li.dataset.id, was = ui.openLists.has(id);
    was ? ui.openLists.delete(id) : ui.openLists.add(id);
    saveLists(); Sound.tick(); render();
    const x = findItem(li.dataset.kind, id), inp = $(`.item[data-id="${id}"] .sub-in`, page);
    if (!was && inp && x && !(x.subs || []).length) inp.focus({ preventScroll: true });
  } else if (act === 'sub') toggleSub(li, el);
  else if (act === 'subadd') addSub(li);
  else if (act === 'subdel') {
    const x = findItem(li.dataset.kind, li.dataset.id), sid = el.closest('.sub').dataset.sub;
    if (x && x.subs) { x.subs = x.subs.filter(s => s.id !== sid); save(); Sound.crumple(); render(); }
  } else if (act === 'add') addItem(el.dataset.kind);
  else if (act === 'freq') { ui.choreFreq = el.dataset.freq; Sound.tick(); render(); const i = $('[data-add="chore"]', page); i && i.focus({ preventScroll: true }); }
  else if (act === 'tear') {
    const s = $('.crossed', page); s.classList.add('tearing'); Sound.rip(); buzz([10, 30, 10]);
    setTimeout(() => {
      const before = state.todos, torn = before.filter(x => x.done).length;
      state.todos = before.filter(x => !x.done); save(); render();
      toast(`Tore out ${torn} crossed-off line${torn === 1 ? '' : 's'}`, () => { state.todos = before; save(); Sound.tick(); render(); });
    }, 680);
  } else if (act === 'year') {
    const d = +el.dataset.d; ui.weeksYear = d === 0 ? isoWeek(today()).year : ui.weeksYear + d; ui.openWeek = null;
    ui.scrollWeek = d === 0; Sound.swish(); render();
  } else if (act === 'week') {
    if (e.target.closest('.wk-edit')) return;
    const k = el.dataset.week; ui.openWeek = ui.openWeek === k ? null : k; Sound.tick(); render();
  } else if (act === 'swatch') saveWeek(el.closest('.wk-edit').dataset.week, el.dataset.color);
  else if (act === 'wsave') saveWeek(el.closest('.wk-edit').dataset.week);
  else if (act === 'wclear') { delete state.weeks[el.closest('.wk-edit').dataset.week]; ui.openWeek = null; save(); Sound.erase(); render(); }
});
page.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-add]')) { e.preventDefault(); addItem(e.target.dataset.add); }
  else if (e.key === 'Enter' && e.target.matches('.due-in')) { e.preventDefault(); addItem('deadline'); }
  else if (e.key === 'Enter' && e.target.matches('.wk-in')) { e.preventDefault(); saveWeek(e.target.closest('.wk-edit').dataset.week); }
  else if (e.key === 'Escape' && e.target.matches('.wk-in')) { ui.openWeek = null; render(); }
  else if (e.key === 'Enter' && e.target.matches('.sub-in')) { e.preventDefault(); addSub(e.target.closest('.item')); }
  else if (e.key === 'Escape' && e.target.matches('.sub-in')) e.target.blur();
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.wk, .sub')) { e.preventDefault(); e.target.click(); }
});
page.addEventListener('dblclick', e => { const t = e.target.closest('.txt'); if (t) startEdit(t); });

// swipe across a line to strike it, with the pencil sound following your speed
page.addEventListener('pointerdown', e => {
  const wrap = e.target.closest('.wrap'); if (!wrap || e.button !== 0) return;
  const li = wrap.closest('.item');
  if (li.classList.contains('is-done') || li.classList.contains('busy') || editing) return;
  const path = $('.strike path', wrap), w = $('.txt', wrap).getBoundingClientRect().width;
  drag = { li, wrap, path, len: path._len || 0, x0: e.clientX, y0: e.clientY, lx: e.clientX, lt: e.timeStamp, active: false, p: 0, dist: clamp(w * 0.85, 90, 280), pid: e.pointerId };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.active) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (dx > 8 && dx > Math.abs(dy)) {
      drag.active = true;
      try { drag.wrap.setPointerCapture(drag.pid); } catch (err) {}
      drag.li.classList.add('dragging'); Sound.dragStart();
    } else return;
  }
  e.preventDefault();
  drag.p = clamp(dx / drag.dist, 0, 1);
  drag.path.style.strokeDashoffset = drag.len * (1 - drag.p);
  const dt = Math.max(1, e.timeStamp - drag.lt), v = Math.abs(e.clientX - drag.lx) / dt * 16;
  drag.lx = e.clientX; drag.lt = e.timeStamp;
  Sound.dragSpeed(v);
}, { passive: false });
const endDrag = e => {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  if (!d.active) return;
  d.li.classList.remove('dragging'); Sound.dragStop();
  if (d.p >= 0.55) cross(d.li, true);
  else { d.path.style.strokeDashoffset = d.len; }
};
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

tabs.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) go(t.dataset.view); });
mast.addEventListener('click', e => {
  if (!e.target.closest('[data-act="sound"]')) return;
  Sound.muted = !Sound.muted; localStorage.setItem('crossedoff.muted', Sound.muted ? '1' : '0');
  renderMast(); Sound.scratch(0.2);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable="true"]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { const i = $('[data-add]', page); if (i) { e.preventDefault(); i.focus(); } }
  const n = parseInt(e.key, 10); if (n >= 1 && n <= VIEWS.length) go(VIEWS[n - 1].id);
});

$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `crossed-off-${T()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); Sound.tick();
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.todos) || !Array.isArray(s.chores) || !Array.isArray(s.deadlines)) throw new Error('not a crossed-off file');
    if (!confirm('Replace everything on this page with the loaded copy?')) return;
    state = Object.assign(blank(), s); save(); Sound.thunk(); render();
  } catch (err) { alert('That file could not be loaded: ' + err.message); }
  e.target.value = '';
});

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => layoutStrikes(), 150); });
let dayStamp = T(); setInterval(() => { if (T() !== dayStamp) { dayStamp = T(); render(); } }, 60000);
$('#ruler').innerHTML = Array.from({ length: 40 }, (_, i) => `<span>${i * 5}</span>`).join('');

if (!V[ui.view]) ui.view = 'today';
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutStrikes());
</script>
</body>
